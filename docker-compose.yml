services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dockyard
      POSTGRES_USER: dockyard
      POSTGRES_PASSWORD: dockyard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockyard"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/dockyard
      DB_USER: dockyard
      DB_PASSWORD: dockyard
      SEED_SAMPLE: "true"
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"

volumes:
  pgdata:
