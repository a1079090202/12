server:
  port: 8080
  # 置于反向代理后时正确识别 X-Forwarded-*（协议/地址）
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    whitelabel:
      enabled: false

spring:
  application:
    name: dockyard
  datasource:
    # 无内置默认口令：必须通过环境变量提供（见 .env.example / docker-compose.yml）
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  timezone: Asia/Shanghai
  slot:
    length-minutes: 30
    capacity: 6          # 每个 30 分钟时段最多预约车辆数（6 个月台）
  fee:
    free-minutes: 90     # 免费等候时长（分钟）
  seed:
    # 生产默认不播种任何演示数据/账号；本地开发用 dev profile（application-dev.yml）覆盖为 true
    sample: ${SEED_SAMPLE:false}
    demo-accounts: ${SEED_DEMO_ACCOUNTS:false}
  bootstrap:
    # 生产首管理员引导：空库时若两者都提供则创建一个 DISPATCHER 账号（密码 BCrypt 加密入库）
    admin-username: ${ADMIN_USERNAME:}
    admin-password: ${ADMIN_PASSWORD:}
