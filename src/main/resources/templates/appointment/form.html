<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('新建预约')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container">
  <div class="panel" style="max-width:640px">
    <h2>新建预约</h2>
    <p class="muted">每 30 分钟一个时段，每个时段全园区最多 6 辆；超额请联系调度员走插单。</p>
    <form class="stacked" th:action="@{/appointments}" method="post">
      <label>订单号</label>
      <input name="orderNo" required placeholder="如 SO-20260912-001">
      <label>车牌号</label>
      <input name="plateNo" required placeholder="如 沪A12348">
      <label>司机姓名</label>
      <input name="driverName" required>
      <label>司机电话</label>
      <input name="driverPhone">
      <label>货类</label>
      <input name="cargoType" required placeholder="如 常温食品 / 冷冻肉 / 大件设备">
      <label>所需月台类型</label>
      <select name="dockType" required>
        <option th:each="t : ${dockTypes}" th:value="${t}" th:text="${t.label}"></option>
      </select>
      <label>预计到达日期</label>
      <input type="date" name="slotDate" th:min="${today}" required>
      <label>预计到达时段（30 分钟整点）</label>
      <select name="slotTime" required>
        <option th:each="t : ${slotTimes}" th:value="${t}" th:text="${t}"></option>
      </select>
      <div style="margin-top:16px"><button class="btn" type="submit">提交预约</button></div>
    </form>
  </div>
</div>
</body>
</html>
