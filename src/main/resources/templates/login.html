<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('登录')}"></head>
<body>
<div class="login-wrap">
  <div class="panel">
    <h1>月台预约调度系统</h1>
    <p class="muted" style="margin-top:0">园区卸货月台预约 / 进场 / 排队 / 核费</p>

    <div th:if="${param.error}" class="flash err">用户名或密码错误</div>
    <div th:if="${param.logout}" class="flash ok">已退出登录</div>

    <form class="stacked" th:action="@{/login}" method="post">
      <label>用户名</label>
      <input name="username" autocomplete="username" autofocus required>
      <label>密码</label>
      <input name="password" type="password" autocomplete="current-password" required>
      <div style="margin-top:16px">
        <button class="btn" type="submit" style="width:100%">登录</button>
      </div>
    </form>

    <p class="muted login-accounts">
      初始账号由管理员在部署时通过 <code>INIT_PASSWORD</code> 指定；未指定时系统在首次启动
      生成随机密码并输出于应用日志（仅一次）。忘记密码请联系管理员重置。
    </p>
  </div>
</div>
</body>
</html>
