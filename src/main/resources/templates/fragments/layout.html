<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · 月台预约调度'">月台预约调度</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<nav class="topbar" th:fragment="nav">
  <a class="brand" th:href="@{/}">🚚 月台调度系统</a>
  <nav>
    <a th:href="@{/}">首页看板</a>
    <a sec:authorize="hasRole('CARRIER')" th:href="@{/appointments/mine}">我的预约</a>
    <a sec:authorize="hasRole('CARRIER')" th:href="@{/appointments/new}">新建预约</a>
    <a sec:authorize="hasRole('GUARD')" th:href="@{/gate}">门卫进场</a>
    <a sec:authorize="hasRole('DISPATCHER')" th:href="@{/dispatch}">排队叫号</a>
    <a sec:authorize="hasRole('DISPATCHER')" th:href="@{/appointments/override}">调度插单</a>
    <a sec:authorize="hasRole('DISPATCHER')" th:href="@{/disputes}">异议处理</a>
    <a sec:authorize="hasRole('DISPATCHER')" th:href="@{/rates}">费率维护</a>
    <a sec:authorize="hasRole('WAREHOUSE')" th:href="@{/warehouse}">仓库作业</a>
    <a th:href="@{/fees/download}">下载核费明细</a>
  </nav>
  <span class="spacer"></span>
  <span class="user">
    <span sec:authentication="principal.username">user</span>
    （<span sec:authentication="principal.displayName">用户</span>）
  </span>
  <form th:action="@{/logout}" method="post">
    <button class="btn-logout" type="submit">退出</button>
  </form>
</nav>
</body>
</html>
