<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('修改密码')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container">
  <div class="panel" style="max-width:520px">
    <h2>修改密码</h2>
    <div th:if="${param.changed}" class="flash ok">密码已更新，下次登录请使用新密码。</div>

    <form class="stacked" th:action="@{/account/password}" th:object="${form}" method="post">
      <label>当前密码</label>
      <input type="password" name="oldPassword" autocomplete="current-password" required>
      <div th:if="${#fields.hasErrors('oldPassword')}" class="flash err" th:errors="*{oldPassword}"></div>

      <label>新密码（至少 8 位）</label>
      <input type="password" name="newPassword" autocomplete="new-password" minlength="8" required>
      <div th:if="${#fields.hasErrors('newPassword')}" class="flash err" th:errors="*{newPassword}"></div>

      <label>确认新密码</label>
      <input type="password" name="confirmPassword" autocomplete="new-password" minlength="8" required>
      <div th:if="${#fields.hasErrors('confirmPassword')}" class="flash err" th:errors="*{confirmPassword}"></div>

      <div style="margin-top:16px">
        <button class="btn" type="submit">保存新密码</button>
        <a class="btn secondary" th:href="@{/}">取消</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
