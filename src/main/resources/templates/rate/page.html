<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('费率维护')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div class="container">
  <div class="panel">
    <h2>承运商等候费率（按上海自然日生效）</h2>
    <p class="muted">
      车辆出场核费时，计费区间落在哪个上海自然日，就用该承运商<strong>当日</strong>费率；
      跨日按天分段。已核费单保存的是费率快照，之后改价不影响历史单。
      <strong>计费当日若未配置费率，出场会被拦下</strong>，需先在此补配。
    </p>
    <div th:if="${param.saved}" class="flash ok">费率已保存</div>

    <form class="stacked" th:action="@{/rates}" method="post" style="max-width:480px">
      <label>承运商</label>
      <select name="carrierId" required>
        <option value="" selected disabled>请选择承运商</option>
        <option th:each="c : ${carriers}" th:value="${c.id}" th:text="${c.name}"></option>
      </select>
      <label>生效日期</label>
      <input type="date" name="rateDate" th:min="${today}" required>
      <label>等候费率（元/小时）</label>
      <input type="number" name="ratePerHour" step="0.01" min="0" required placeholder="如 60.00">
      <div style="margin-top:16px"><button class="btn" type="submit">保存费率</button></div>
    </form>
  </div>

  <div class="panel" style="margin-top:16px">
    <h2>已配置费率</h2>
    <table>
      <thead><tr><th>生效日期</th><th>承运商</th><th>费率（元/小时）</th></tr></thead>
      <tbody>
      <tr th:each="r : ${rateList}">
        <td class="nowrap" th:text="${r.rateDate}"></td>
        <td th:text="${ref.carrierName(r.carrierId)}"></td>
        <td class="mono" th:text="${#numbers.formatDecimal(r.ratePerHour, 1, 2)}"></td>
      </tr>
      <tr th:if="${rateList.isEmpty()}"><td colspan="3" class="muted">尚未配置任何费率</td></tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
