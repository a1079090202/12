# 开发环境覆盖配置：启动时自动播种演示账号（carrier1/carrier2/guard/warehouse/dispatcher，
# 初始密码 dock1234）与 20 条样例预约，便于本地走查。切勿在生产使用 dev profile。
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dockyard}
    username: ${DB_USER:dockyard}
    password: ${DB_PASSWORD:dockyard}
  thymeleaf:
    cache: false

app:
  seed:
    sample: true
    demo-accounts: true
